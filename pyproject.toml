[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-still"
version = "0.1.0"
description = "Post-production ingest: map drives, extract MXF metadata, generate stills."
requires-python = ">=3.12"
dependencies = [
    "moviepy>=2.1",
    "pillow>=11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
